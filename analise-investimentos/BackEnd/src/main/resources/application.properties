spring.application.name=analise-investimentos
databricks.host=${DATABRICKS_HOST:http://localhost:8081}
databricks.token=${DATABRICKS_TOKEN:}
databricks.warehouse-id=${DATABRICKS_WAREHOUSE_ID:}

# LLM opcional, desativada por padrão; habilitar somente com consentimento para envio do texto ao provedor.
analise.llm.enabled=${ANALISE_LLM_ENABLED:false}
analise.llm.endpoint=${ANALISE_LLM_ENDPOINT:}
analise.llm.api-key=${ANALISE_LLM_API_KEY:}
analise.llm.model=${ANALISE_LLM_MODEL:}
